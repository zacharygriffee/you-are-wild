name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix app

      - name: Install Playwright Chromium
        run: cd app && npx playwright install --with-deps chromium

      - name: Run full build
        run: npm run full-build

      - name: Run branding audit
        run: npm run audit:branding

      - name: Check whitespace
        run: git diff --check

      - name: Check generated-source cleanliness
        run: git diff --exit-code -- ':!dist/you-are-wild.html'

      - name: Upload playable HTML
        uses: actions/upload-artifact@v4
        with:
          name: you-are-wild-html
          path: dist/you-are-wild.html
          if-no-files-found: error
