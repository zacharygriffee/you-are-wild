<!DOCTYPE html>
<html>
<head>
<style>
.tutorial-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 10000;
}
.tutorial-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 10001;
}
.tutorial-tooltip {
    position: fixed !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    background: #363635;
    border: 4px solid #b5a886;
    border-radius: 12px;
    padding: 20px;
    max-width: 400px;
    z-index: 10002;
}
</style>
</head>
<body>
<div id="container"></div>
<script>
let step = 0;
const STEPS = [
    {title: 'Step 1', content: 'First step'},
    {title: 'Step 2', content: 'Second step - should stay centered'},
    {title: 'Step 3', content: 'Third step'}
];

function createOverlay() {
    const overlay = document.createElement('div');
    overlay.className = 'tutorial-overlay';
    overlay.innerHTML = `
        <div class="tutorial-backdrop"></div>
        <div class="tutorial-tooltip">
            <h3 class="title"></h3>
            <p class="content"></p>
            <button onclick="next()">Next</button>
            <button onclick="closeTutorial()">Close</button>
        </div>
    `;
    document.body.appendChild(overlay);
    return overlay;
}

function showStep() {
    const overlay = document.querySelector('.tutorial-overlay');
    if (!overlay) {
        createOverlay();
    }
    const s = STEPS[step];
    document.querySelector('.title').textContent = s.title;
    document.querySelector('.content').textContent = s.content;
    console.log('Showing step', step);
}

function next() {
    step++;
    if (step >= STEPS.length) step = 0;
    showStep();
}

function closeTutorial() {
    document.querySelector('.tutorial-overlay')?.remove();
}

// Start
showStep();
</script>
</body>
</html>
